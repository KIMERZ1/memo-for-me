name: StickyNotes
options:
  bundleIdPrefix: com.kimerz
  deploymentTarget:
    macOS: "14.0"
packages:
  StickyCore:
    path: .
targets:
  StickyNotes:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: StickyCore
    entitlements:
      path: App/StickyNotes.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: 메모지
        CFBundleDisplayName: 메모지
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSFaceIDUsageDescription: 보안 메모지를 열기 위해 인증합니다.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimerz.stickynotes
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
